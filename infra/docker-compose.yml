# Local development stack: `docker compose up --build` from this folder.
# Web: http://localhost:8081  ·  API: http://localhost:8080/actuator/health  ·  DB: localhost:5432
# Road import (see data/README.md): `docker compose --profile tools run --rm import ...`
name: routerank

x-db-env: &db-env
  POSTGRES_DB: routerank
  POSTGRES_USER: routerank
  POSTGRES_PASSWORD: routerank # local development only

services:
  db:
    image: postgis/postgis:18-3.6
    environment: *db-env
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/18 (same major version as Azure)
      - db-data-18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routerank -d routerank"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ../backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/routerank
      SPRING_DATASOURCE_USERNAME: routerank
      SPRING_DATASOURCE_PASSWORD: routerank
      # Local values; the web service's nginx sends the same proxy secret
      ROUTERANK_AUTH_PROXY_SECRET: local-dev-proxy-secret
      ROUTERANK_AUTH_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-not-configured.apps.googleusercontent.com}
      ROUTERANK_AUTH_ALLOWED_ORIGINS: http://localhost:8081,http://localhost:5173,http://localhost:4173
    ports:
      - "8080:8080"

  web:
    build: ../frontend
    depends_on:
      - api
    ports:
      - "8081:80"
    volumes:
      - ../data/downloads:/tiles:ro # base map from data/basemap/build.sh

  # Applies the backend's Flyway migrations without starting the API
  migrate:
    profiles: [tools]
    image: flyway/flyway:12.4.0
    depends_on:
      db:
        condition: service_healthy
    command: -url=jdbc:postgresql://db:5432/routerank -user=routerank -password=routerank -locations=filesystem:/migrations migrate
    volumes:
      - ../backend/src/main/resources/db/migration:/migrations:ro

  import:
    profiles: [tools]
    build: ../data
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://routerank:routerank@db:5432/routerank
    volumes:
      - ../data/downloads:/work

volumes:
  db-data-18:
