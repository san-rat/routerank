# Production on the Azure VM (see README.md). The deploy workflow copies this file and the Caddyfile
# to ~/routerank and runs `docker compose pull && docker compose up -d` there.
# ~/routerank/.env (never in git) holds API_HOST, the database settings and the ROUTERANK_AUTH_* secrets;
# graph.env names the routing graph. Run compose with both:
#   docker compose --env-file .env --env-file graph.env up -d
name: routerank

services:
  api:
    image: ghcr.io/san-rat/routerank-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # The free VMs have about 1 GB of RAM: cap the heap
      JAVA_TOOL_OPTIONS: -Xmx512m
      ROUTERANK_ROUTING_GRAPH_LOCATION: /graph
    volumes:
      # Memory-mapped read-only: the graph lives in the page cache, not the heap
      - ./graphs/${GRAPH:?set GRAPH in graph.env}:/graph:ro
    expose:
      - "8080"

  caddy:
    image: caddy:2.11
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_HOST: ${API_HOST:?set API_HOST in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
