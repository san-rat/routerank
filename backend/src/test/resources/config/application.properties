# Test-only values for the required sign-in settings (loaded on top of the main application.properties)
routerank.auth.google-client-id=test-client.apps.googleusercontent.com
routerank.auth.proxy-secret=test-proxy-secret

# Routing on the Colombo fixture: the graph is built from it on first start (into build/), and the same
# file's roads and places are loaded by the test-only migration in db/testdata (data/tests/make_backend_fixture.py)
routerank.routing.graph-location=build/test-graph
routerank.routing.osm-file=../data/fixtures/colombo.osm.pbf
spring.flyway.locations=classpath:db/migration,classpath:db/testdata
