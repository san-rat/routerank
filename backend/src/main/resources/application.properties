spring.application.name=routerank-api
management.endpoints.web.exposure.include=health,info

# Sign-in and the proxy lock (see the Architecture doc, Security). Required, set by environment variables:
# ROUTERANK_AUTH_GOOGLE_CLIENT_ID and ROUTERANK_AUTH_PROXY_SECRET
routerank.auth.allowed-origins=https://routerank.pages.dev,http://localhost:5173,http://localhost:4173

# Sessions live in PostgreSQL (Spring Session; tables from Flyway), so deploys don't sign people out
server.servlet.session.cookie.name=__Host-session
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
server.servlet.session.timeout=7d
spring.session.jdbc.initialize-schema=never

# The API only returns JSON
springdoc.default-produces-media-type=application/json

# The 30-minute scoring job (see the Architecture doc). It publishes to R2 only when all four are set, by
# environment variables on the VM: ROUTERANK_SCORING_PUBLISH_ENDPOINT (https://<ACCOUNT_ID>.r2.cloudflarestorage.com),
# ROUTERANK_SCORING_PUBLISH_BUCKET, ROUTERANK_SCORING_PUBLISH_ACCESS_KEY_ID, ROUTERANK_SCORING_PUBLISH_SECRET_ACCESS_KEY.
# Admins (who may also run it now) have role = 'admin' in app_user, set by hand in the database.

# Anti-fraud (see the Architecture doc, "Free anti-fraud layers"). Set by environment variables on the VM:
# ROUTERANK_TURNSTILE_SECRET (the Turnstile widget's secret key; without it sign-in and saves aren't bot-checked)
# and ROUTERANK_FRAUD_DEVICE_HMAC_KEY (a long random secret; without it no device signal is stored).
# Thresholds, limits and weights are under routerank.fraud.* (FraudProperties).
routerank.turnstile.hostnames=routerank.pages.dev
