name: Frontend

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Build check only; the deploy workflow uses the real R2 URL
          VITE_TILES_URL: https://tiles.example.invalid/sri-lanka.pmtiles
      - name: Docker image builds
        run: docker build -t routerank-web:ci .
