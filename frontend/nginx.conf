server {
    listen 80;
    root /usr/share/nginx/html;

    # Every view has its own address, so unknown paths fall back to the app
    location / {
        try_files $uri /index.html;
    }

    # Local stack only: the API, as the Pages Function forwards it in production (functions/api)
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header X-RouteRank-Proxy-Secret local-dev-proxy-secret;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Local stack only: the base map mounted from data/downloads (range requests built in)
    location /tiles/ {
        alias /tiles/;
    }
}
